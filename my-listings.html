<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - SpotIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">SpotIt</div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="report-lost.html">Report Lost</a>
            <a href="report-found.html">Report Found</a>
            <a href="listings.html">View All Items</a>
            <a href="my-listings.html" class="active">My Listings</a>
        </div>
        <div class="nav-user">
            <span id="userName"></span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container">

        <div class="welcome-section">
            <h2>My Listings</h2>
            <p>Manage the lost and found items you have reported.</p>
        </div>

        <div class="filter-bar">
            <div class="form-group">
                <label>Search</label>
                <input type="text" id="searchInput" placeholder="Search by item name..." oninput="applyFilters()" />
            </div>
            <div class="form-group">
                <label>Type</label>
                <select id="filterType" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="lost">Lost</option>
                    <option value="found">Found</option>
                </select>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="filterCategory" onchange="applyFilters()">
                    <option value="">All Categories</option>
                    <option>Electronics</option>
                    <option>ID Card / Documents</option>
                    <option>Keys</option>
                    <option>Books / Notes</option>
                    <option>Wallet / Purse</option>
                    <option>Clothing</option>
                    <option>Water Bottle</option>
                    <option>Bag / Backpack</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="filterStatus" onchange="applyFilters()">
                    <option value="">All</option>
                    <option value="open">Open</option>
                    <option value="resolved">Resolved</option>
                    <option value="expired">Expired</option>
                </select>
            </div>
            <button onclick="clearFilters()" class="filter-btn secondary">Clear</button>
        </div>

        <p id="resultsInfo" class="results-info"></p>
        <div id="itemsGrid" class="items-grid"></div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>

        const currentUser = JSON.parse(sessionStorage.getItem("vitUser"));
        let activeItem = null;

        function renderItems(items) {
            const grid = document.getElementById("itemsGrid");
            document.getElementById("resultsInfo").textContent = items.length + " item(s) found";

            if (items.length === 0) {
                grid.innerHTML = '<p class="no-items">No items match your search. Try different filters.</p>';
                return;
            }

            grid.innerHTML = "";

            items.forEach(item => {
                const isOwner = currentUser && currentUser.email === item.postedBy;
                const desc = item.description.length > 90
                    ? item.description.substring(0, 90) + "..."
                    : item.description;

                let actionArea = "";
                if (item.type === "found" && !isOwner && item.status === "open") {
                    if (item.questions && item.questions.length > 0) {
                        actionArea = `<button onclick="openClaim('${item.id}')" class="claim-btn">🔐 Claim this item</button>`;
                    } else {
                        actionArea = `<div class="contact-info">📞 Contact: ${item.contact}</div>
                                      <div class="contact-info">📦 Item is at: ${item.currentLocation}</div>`;
                    }
                } else if (item.type === "found" && isOwner) {
                    actionArea = `<div class="contact-info">📞 Your contact: ${item.contact}</div>
                                  <div class="contact-info">📦 Item is at: ${item.currentLocation}</div>`;
                } else if (item.type === "lost" && item.status === "open") {
                    actionArea = `<div class="contact-info">📞 Contact: ${item.contact}</div>`;
                }

                const resolveBtn = isOwner && item.status === "open"
                    ? `<button onclick="markResolved('${item.id}')" class="resolve-btn">✅ Mark as Resolved</button>`
                    : "";

                grid.innerHTML += `
                    <div class="item-card" id="card-${item.id}">
                        <div class="card-top ${item.type}">
                            <span class="type-badge">${item.type === "lost" ? "🔍 LOST" : "✅ FOUND"}</span>
                            <span class="status-badge ${item.status}">${item.status.toUpperCase()}</span>
                        </div>
                        <div class="card-body">
                            <h4 class="card-title">${item.title}</h4>
                            <p class="card-desc">${desc}</p>
                            <div class="card-meta">
                                <span>📍 ${item.location}</span>
                                <span>📅 ${formatDate(item.date)}</span>
                            </div>
                            <div class="card-footer">
                                <span class="cat-tag">${item.category}</span>
                                <span class="posted-by">by ${item.postedByName.split(" ")[0]}</span>
                            </div>
                            ${actionArea}
                            ${resolveBtn}
                        </div>
                    </div>
                `;
            });
        }

        function applyFilters() {
            const search   = document.getElementById("searchInput").value.toLowerCase();
            const type     = document.getElementById("filterType").value;
            const category = document.getElementById("filterCategory").value;
            const status   = document.getElementById("filterStatus").value;

            let items = getAllItems().reverse().filter(i => i.postedBy === currentUser.email);

            if (search)   items = items.filter(i => i.title.toLowerCase().includes(search) || i.description.toLowerCase().includes(search));
            if (type)     items = items.filter(i => i.type === type);
            if (category) items = items.filter(i => i.category === category);
            if (status)   items = items.filter(i => i.status === status);

            renderItems(items);
        }

        function clearFilters() {
            document.getElementById("searchInput").value = "";
            document.getElementById("filterType").value = "";
            document.getElementById("filterCategory").value = "";
            document.getElementById("filterStatus").value = "";
            applyFilters();
        }

        function markResolved(itemId) {
            if (!confirm("Mark this item as resolved?")) return;
            updateItemStatus(itemId, "resolved");
            applyFilters();
        }

        applyFilters();

    </script>
</body>
</html>
