<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SpotIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">SpotIt</div>
        <div class="nav-links">
            <a href="admin.html" class="active">Admin Dashboard</a>
        </div>
        <div class="nav-user">
            <span class="admin-badge">ADMIN</span>
            <span id="userName"></span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container">

        <div class="welcome-section">
            <h2>Admin Dashboard</h2>
            <p>Full control over all SpotIt listings and users.</p>
        </div>

        <!-- overview stats -->
        <div class="admin-stats">
            <div class="stat-card lost">
                <h3 id="totalLost">0</h3>
                <p>Lost Items</p>
            </div>
            <div class="stat-card found">
                <h3 id="totalFound">0</h3>
                <p>Found Items</p>
            </div>
            <div class="stat-card resolved">
                <h3 id="totalResolved">0</h3>
                <p>Resolved</p>
            </div>
            <div class="stat-card" style="border-top: 4px solid var(--vit-light-blue);">
                <h3 id="totalUsers">0</h3>
                <p>Total Users</p>
            </div>
        </div>

        <!-- tabs -->
        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchTab('listings')">📋 All Listings</button>
            <button class="admin-tab" onclick="switchTab('users')">👥 Registered Users</button>
        </div>

        <!-- ALL LISTINGS TAB -->
        <div id="tab-listings" class="admin-section active">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
                <h3 style="font-size:18px; font-weight:600;">All Listings</h3>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <select id="adminFilterType" onchange="renderListings()" style="padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px; outline:none;">
                        <option value="">All Types</option>
                        <option value="lost">Lost</option>
                        <option value="found">Found</option>
                    </select>
                    <select id="adminFilterStatus" onchange="renderListings()" style="padding:8px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:inherit; font-size:13px; outline:none;">
                        <option value="">All Status</option>
                        <option value="open">Open</option>
                        <option value="resolved">Resolved</option>
                    </select>
                </div>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Posted By</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="listingsTableBody">
                    <!-- filled by JS -->
                </tbody>
            </table>
        </div>

        <!-- USERS TAB -->
        <div id="tab-users" class="admin-section">
            <h3 style="font-size:18px; font-weight:600; margin-bottom:16px;">Registered Users</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Items Posted</th>
                        <th>Items Resolved</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- filled by JS -->
                </tbody>
            </table>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>

        // make sure only admin can access this page
        const currentUser = JSON.parse(sessionStorage.getItem("vitUser"));
        if (!currentUser || !currentUser.isAdmin) {
            window.location.href = "index.html";
        }

        // ---- tab switching ----

        function switchTab(tabName) {
            // hide all sections
            document.querySelectorAll(".admin-section").forEach(s => s.classList.remove("active"));
            document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));

            // show selected
            document.getElementById("tab-" + tabName).classList.add("active");
            event.target.classList.add("active");
        }

        // ---- load stats ----

        function loadStats() {
            const items = getAllItems();
            document.getElementById("totalLost").textContent = items.filter(i => i.type === "lost").length;
            document.getElementById("totalFound").textContent = items.filter(i => i.type === "found").length;
            document.getElementById("totalResolved").textContent = items.filter(i => i.status === "resolved").length;

            // count unique users from items
            const uniqueUsers = [...new Set(items.map(i => i.postedBy))];
            document.getElementById("totalUsers").textContent = uniqueUsers.length;
        }

        // ---- listings table ----

        function renderListings() {
            const filterType   = document.getElementById("adminFilterType").value;
            const filterStatus = document.getElementById("adminFilterStatus").value;

            let items = getAllItems().reverse();
            if (filterType)   items = items.filter(i => i.type === filterType);
            if (filterStatus) items = items.filter(i => i.status === filterStatus);

            const tbody = document.getElementById("listingsTableBody");

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">No listings found.</td></tr>';
                return;
            }

            tbody.innerHTML = "";

            items.forEach(item => {
                const resolveBtn = item.status === "open"
                    ? `<button class="admin-resolve-btn" onclick="adminResolve('${item.id}')">✅ Resolve</button>`
                    : `<span style="color:var(--text-light); font-size:12px;">Resolved</span> `;

                tbody.innerHTML += `
                    <tr id="row-${item.id}">
                        <td><strong>${item.title}</strong></td>
                        <td>
                            <span style="
                                background: ${item.type === 'lost' ? '#fdecea' : '#e8f8ee'};
                                color: ${item.type === 'lost' ? 'var(--lost-color)' : 'var(--found-color)'};
                                padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;">
                                ${item.type.toUpperCase()}
                            </span>
                        </td>
                        <td>${item.category}</td>
                        <td>${item.location}</td>
                        <td>${item.postedByName.split(" ")[0]}<br><span style="color:var(--text-light);font-size:11px;">${item.postedBy}</span></td>
                        <td>${formatDate(item.date)}</td>
                        <td>
                            <span class="status-badge ${item.status}">${item.status.toUpperCase()}</span>
                        </td>
                        <td>
                            ${resolveBtn}
                            <button class="delete-btn" onclick="adminDelete('${item.id}')">🗑 Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function adminResolve(itemId) {
            if (!confirm("Mark this item as resolved?")) return;
            updateItemStatus(itemId, "resolved");
            renderListings();
            loadStats();
        }

        function adminDelete(itemId) {
            if (!confirm("Are you sure you want to delete this listing? This cannot be undone.")) return;

            // remove from localStorage
            let items = getAllItems();
            items = items.filter(i => i.id !== itemId);
            localStorage.setItem("vitLostFoundItems", JSON.stringify(items));

            // remove the row from the table smoothly
            const row = document.getElementById("row-" + itemId);
            if (row) row.remove();

            loadStats();
        }

        // ---- users table ----

        function renderUsers() {
            const items = getAllItems();

            // build a map of user email -> their info and stats
            const usersMap = {};
            items.forEach(item => {
                if (!usersMap[item.postedBy]) {
                    usersMap[item.postedBy] = {
                        name: item.postedByName,
                        email: item.postedBy,
                        totalPosted: 0,
                        totalResolved: 0
                    };
                }
                usersMap[item.postedBy].totalPosted++;
                if (item.status === "resolved") {
                    usersMap[item.postedBy].totalResolved++;
                }
            });

            const users = Object.values(usersMap);
            const tbody = document.getElementById("usersTableBody");

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-data">No users have posted anything yet.</td></tr>';
                return;
            }

            tbody.innerHTML = "";
            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${user.name}</strong></td>
                        <td>${user.email}</td>
                        <td>${user.totalPosted}</td>
                        <td>${user.totalResolved}</td>
                    </tr>
                `;
            });
        }

        // kick off everything
        loadStats();
        renderListings();
        renderUsers();

    </script>

</body>
</html>
