<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost Item - SpotIt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">SpotIt</div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="report-lost.html" class="active">Report Lost</a>
            <a href="report-found.html">Report Found</a>
            <a href="listings.html">View All Items</a>
        </div>
        <div class="nav-user">
            <span id="userName"></span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">

            <h2 class="form-title">🔍 Report a Lost Item</h2>
            <p class="form-subtitle">Fill in the details as accurately as possible. Other students will see this and can help you find it.</p>

            <div id="successMsg" class="success-msg" style="display: none;">
                ✅ Your report has been submitted! <a href="listings.html">View all listings</a>
            </div>

            <div class="form-group">
                <label>Item Name *</label>
                <input type="text" id="itemTitle" placeholder="e.g. Blue HP Laptop, VIT ID Card, Airpods" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Category *</label>
                    <select id="itemCategory">
                        <option value="">-- Select category --</option>
                        <option>Electronics</option>
                        <option>ID Card / Documents</option>
                        <option>Keys</option>
                        <option>Books / Notes</option>
                        <option>Wallet / Purse</option>
                        <option>Clothing</option>
                        <option>Water Bottle</option>
                        <option>Bag / Backpack</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Last Seen Location *</label>
                    <select id="itemLocationSelect" onchange="handleLocationSelect()">
                        <option value="">-- Select location --</option>
                        <option>Main Building (MB)</option>
                        <option>Technology Tower (TT)</option>
                        <option>GDN Block</option>
                        <option>SJT Block</option>
                        <option>PRP Block</option>
                        <option>Anna Auditorium</option>
                        <option>Library</option>
                        <option>Hostel - Men's</option>
                        <option>Hostel - Women's</option>
                        <option value="custom">Other...</option>
                    </select>
                    <input type="text" id="itemLocationCustom" placeholder="e.g. Room 204, SJT Block" style="display:none; margin-top: 8px;" />
                </div>
            </div>

            <div class="form-group">
                <label>Date Lost *</label>
                <input type="date" id="itemDate" />
            </div>

            <div class="form-group">
                <label>Description *</label>
                <textarea id="itemDesc" rows="4" placeholder="Describe the item clearly - color, brand, model, size, any scratches or stickers, serial number if you remember..."></textarea>
            </div>

            <div class="form-group">
                <label>Your Contact Number *</label>
                <input type="text" id="itemContact" placeholder="Phone number or alternate email" />
            </div>

            <button onclick="submitForm()" class="submit-btn">Submit Lost Item Report</button>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script>

        function handleLocationSelect() {
            const select = document.getElementById("itemLocationSelect");
            const customInput = document.getElementById("itemLocationCustom");
            if (select.value === "custom") {
                customInput.style.display = "block";
                customInput.focus();
            } else {
                customInput.style.display = "none";
                customInput.value = "";
            }
        }

        function submitForm() {
            const title    = document.getElementById("itemTitle").value.trim();
            const category = document.getElementById("itemCategory").value;
            const date     = document.getElementById("itemDate").value;
            const desc     = document.getElementById("itemDesc").value.trim();
            const contact  = document.getElementById("itemContact").value.trim();

            const locationSelect = document.getElementById("itemLocationSelect").value;
            const locationCustom = document.getElementById("itemLocationCustom").value.trim();
            const location = locationSelect === "custom" ? locationCustom : locationSelect;

            if (!title || !category || !date || !desc || !contact) {
                alert("Please fill in all the required fields!");
                return;
            }
            if (!location) {
                alert("Please select or type a location!");
                return;
            }

            const user = JSON.parse(sessionStorage.getItem("vitUser"));

            const newItem = {
                id: generateId(),
                type: "lost",
                title: title,
                category: category,
                location: location,
                date: date,
                description: desc,
                contact: contact,
                postedBy: user.email,
                postedByName: user.name,
                status: "open",
                timestamp: Date.now()
            };

            saveItem(newItem);

            document.getElementById("successMsg").style.display = "block";
            document.getElementById("itemTitle").value = "";
            document.getElementById("itemCategory").value = "";
            document.getElementById("itemLocationSelect").value = "";
            document.getElementById("itemLocationCustom").value = "";
            document.getElementById("itemLocationCustom").style.display = "none";
            document.getElementById("itemDate").value = "";
            document.getElementById("itemDesc").value = "";
            document.getElementById("itemContact").value = "";
            window.scrollTo(0, 0);
        }

    </script>

</body>
</html>
