<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotIt – Digital Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-container">
        <div class="login-box">
            
            <div class="brand-header">
                <span class="uni-badge">VIT Vellore</span>
                <h1 class="site-title-gradient">SpotIt</h1>
                <p class="login-subtitle">Digital Lost & Found</p>
            </div>

            <button id="googleLoginBtn" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="22">
                Continue with Google
            </button>

            <div id="errorMsg" class="error-msg" style="display: none;"></div>

            <p class="note">🔒 Secure login via @vitstudent.ac.in or @vit.ac.in</p>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>

</body>
</html>
